<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGlow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#7fc66b" />
      <stop offset="100%" stop-color="#246b3c" />
    </linearGradient>
    <filter id="dropShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#174b2a" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Заокруглений фон іконки -->
  <rect width="512" height="512" rx="112" fill="url(#bgGlow)" />

  <!-- Будинок -->
  <g filter="url(#dropShadow)">
    <!-- Основний контур та стіни -->
    <path d="M 256 96 L 100 236 A 20 20 0 0 0 114 270 L 140 270 L 140 390 A 20 20 0 0 0 160 410 L 352 410 A 20 20 0 0 0 372 390 L 372 270 L 398 270 A 20 20 0 0 0 412 236 Z" fill="#ffffff" />
    
    <!-- Димар -->
    <path d="M 320 160 L 320 110 A 10 10 0 0 1 330 100 L 350 100 A 10 10 0 0 1 360 110 L 360 196 Z" fill="#ffffff" />

    <!-- Вікно -->
    <rect x="224" y="230" width="64" height="64" rx="8" fill="#246b3c" />
    <line x1="256" y1="230" x2="256" y2="294" stroke="#ffffff" stroke-width="4" />
    <line x1="224" y1="262" x2="288" y2="262" stroke="#ffffff" stroke-width="4" />

    <!-- Двері -->
    <path d="M 232 330 L 280 330 A 8 8 0 0 1 288 338 L 288 410 L 232 410 Z" fill="#246b3c" />
    <!-- Ручка дверей -->
    <circle cx="276" cy="375" r="4" fill="#ffffff" />
  </g>
</svg>